name: Sync content from spreadsheet

# Pulls the organizers' Google Sheet (Settings, Dates, Announcements tabs) into the site
# and redeploys when something changed. Runs every 6 hours, and on demand from the
# Actions tab -> "Sync content from spreadsheet" -> Run workflow.
#
# One-time setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
# New repository variable  SHEET_ID  = the long id in the sheet's URL
# (https://docs.google.com/spreadsheets/d/<SHEET_ID>/edit). The sheet must be shared as
# "Anyone with the link: Viewer".
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check SHEET_ID is set
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "::notice::SHEET_ID repository variable is not set yet; nothing to sync."
            exit 1
          fi

      - name: Pull the sheet
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync-sheet.mjs

      - name: Commit, push and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data src/content/announcements
          if git diff --cached --quiet; then
            echo "Sheet and site already match."
            exit 0
          fi
          git commit -m "Update site content from spreadsheet"
          git push
          # Pushes made with the built-in token do not trigger other workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
